name: Sincronizar catalogo Alegra

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos
  workflow_dispatch: {}       # permite ejecutarlo manualmente con un boton

permissions:
  contents: write

concurrency:
  group: sync-catalogo
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descargar catalogo de Alegra
        run: node sync.js
        env:
          ALEGRA_EMAIL: ${{ secrets.ALEGRA_EMAIL }}
          ALEGRA_TOKEN: ${{ secrets.ALEGRA_TOKEN }}
          DATOS_TOKEN: ${{ secrets.DATOS_TOKEN }}
          REPO_DATOS: geekstore100-hue/geekstore-datos

      - name: Publicar productos.json si cambio
        run: |
          git config user.name "geekstore-sync"
          git config user.email "sync@users.noreply.github.com"
          git add productos.json
          git diff --cached --quiet && echo "Sin cambios en el catalogo" || (git commit -m "Catalogo actualizado" && git push)
